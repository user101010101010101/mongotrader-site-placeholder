  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoTrader — Coming Soon</title>
  <meta name="description" content="MongoTrader — intelligent portfolio management and algorithmic trading. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0e17;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Subtle animated gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(168, 85, 247, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 50%, rgba(126, 34, 206, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(192, 132, 252, 0.06), transparent);
      z-index: 0;
      animation: drift 20s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { opacity: 1; }
      50%  { opacity: 0.7; }
      100% { opacity: 1; }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      padding: 2rem;
      text-align: center;
    }

    .logo-mark {
      width: 88px;
      height: 88px;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 32px rgba(168, 85, 247, 0.35));
    }

    .logo-mark svg {
      width: 88px;
      height: 88px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #f8fafc, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 300;
      color: #94a3b8;
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 3rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      background: rgba(168, 85, 247, 0.08);
      font-size: 0.875rem;
      font-weight: 500;
      color: #c084fc;
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a855f7;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.5); }
      50%      { opacity: 0.6; box-shadow: 0 0 0 6px rgba(168, 85, 247, 0); }
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: #475569;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
  </style>
